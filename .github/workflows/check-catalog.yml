# Every API v2 page must be listed in README.md, docs/index.md, docs/llms.txt and
# docs/api/v2/README.md (CONTRIBUTING.md, "Pages that list the endpoints").
# A red check here means a page is missing from one of them or a link is broken.
name: Check catalog

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pages listed and links valid
        run: python3 scripts/check_catalog.py
